          type: string
          nullable: true
          description: The payment option chosen by the insured during the checkout process.
        status:
          type: string
          enum:
          - archived
          - purchased
          - checked_out
          - elected
          - ready_for_checkout
          - created
          description: The state of the program
        sub_total_cents:
          type: integer
          description: The amount to be payed by the insured including all premium and fees applicable to the program. The
            value is represented in cents.
        success_callback_url:
          type: string
          nullable: true
          description: A URL to send the user back to after successful transaction occurs during the checkout process.
        updated_at:
          type: string
          format: date-time
          description: The date the program was last updated. The date uses UTC and is represented in the iso8601 format.
        metadata:
          type: object
          description: Metadata associated with the program.
          nullable: true
    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the refund
        created_at:
          type: string
          format: datetime
          description: Date when the refund was created.
        paid_at:
          type: string
          format: datetime
          description: Date when the refund was initiated.
        amount_cents:
          type: integer
          description: The amount to refund insured
        status:
          type: string
          enum:
          - unpaid
          - paying
          - paid
          - canceled
          description: The status of the refund
        refundable_id:
          type: string
          format: uuid
          nullable: true
          description: The unique identifier of the object that is being refunded
        refundable_type:
          type: string
          nullable: true
          description: The type of the object being refunded
          enum:
          - Billable
          - Invoice
          - Program
          - InstallmentPlan
          - ReducingEndorsement
        return_id:
          type: string
          format: uuid
          nullable: true
          description: The unique identifier of the return that resulted in the refund being created
        return_type:
          type: string
          nullable: true
          description: The type of the return that resulted in the refund being created
          enum:
          - ReducingEndorsementReturn
          - BillableCancelation
      required:
      - amount_cents
      - status
      - refundable_id
      - refundable_type
    Return:
      type: object
      description: A document representing a return of funds on a one time payment or installment plan.
      properties:
        id:
          description: The unique identifier of the return.
          format: uuid
          type: string
          readOnly: true
        amount_cents:
          description: The amount to return to the payer.
          type: integer
        due_date:
          type: string
          format: date
          description: The date by which the return invoice should be paid.
          readOnly: true
        installment_plan_id:
          description: The unique identifier of the installment plan the return is for.
          format: uuid
          type: string
          nullable: true
        one_time_payment_id:
          description: The unique identifier of the one time payment the return is for.
          format: uuid
          type: string
          nullable: true
        remittance_memo:
          type: string
          description: Information about why the funds are being returned.
        status:
          type: string
          description: The current state of the one time paymentreturn.
          example: awaiting_payment
          readOnly: true
          enum:
          - draft
          - awaiting_payment
          - overdue
          - processing_payment
          - paid
          - void

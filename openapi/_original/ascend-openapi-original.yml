                      items:
                        type: string
                        format: uuid
                producer_id:
                  description: The user id associated to the producer of this program. This user is listed on the premium
                    finance agreement.
                  format: uuid
                  type: string
                return_url:
                  description: A URL to send the user back to after dismissing the checkout process. This defaults to the

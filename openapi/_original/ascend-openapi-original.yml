components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
  schemas:
    Account:
      type: object
      description: Response data for a successful organization creation or query.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the organization.
        default_account_fees_cents:
          type: integer
          description: Default account fees in cents.
          minimum: 0
        default_seller_commission_rate:
          type: string
          description: Default commission rate for the seller.
        billing_type:
          type: string
          enum:
          - agency
          - direct
          description: Billing type of the account
        status:
          type: string
          enum:
          - created
          - active
          - archived
          description: Current status of the organization.
        name:
          type: string
          description: Name of the partner organization.
        payable_accounts:
          type: array
          description: List of payable accounts associated with the organization.
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - check
                - bank_account
                description: Type of payable account.
              status:
                type: string
                enum:
                - verified
                - unverified
                - verifying
                - rejected
                description: Verification status of the payable account.
            required:
            - type
            - status
        contact:
          type: object
          description: Agency contact information for the account
          properties:
            id:
              type: string
              format: uuid
              description: User id of the contact
            first_name:
              type: string
              description: First name of the contact
            last_name:
              type: string
              description: Last name of the contact
            phone:
              type: string
              nullable: true
              description: Phone number of the contact
            email:
              type: string
              format: email
              description: Email of the contact
      required:
      - id
      - default_account_fees_cents
      - default_seller_commission_rate
      - status
      - payable_accounts
      - billing_type
    Attachment:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document.
        title:
          type: string
          nullable: true
          description: Title of the document.
        url:
          type: string
          description: The url of the document.
        visibility:
          type: string
          enum:
          - public
          - private
          description: Determines who can see this document. When visibility is set to public, anyone with access to public
            urls such as checkout url will be able to see these documents. When visibility is set to private, only users from
            your organization will be able to see the documents.
      required:
      - id
      - title
      - url
    Billable:
      type: object
      description: An insurance quote or endorsement to be billed to the insured.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the billable.
        agency_fees_cents:
          type: integer
          minimum: 0
          description: Fee collected by your agency. Fully earned, not financeable, and funded directly to your agency.
        billable_identifier:
          type: string
          description: The identifier assigned to the quote/endorsement by the issuing carrier or wholesaler.
        broker_fee_cents:
          type: integer
          minimum: 0
          description: Fee collected by the wholesaler. Fully earned, not financeable, and funded directly to the wholesaler.
        carrier:
          $ref: '#/components/schemas/Carrier'
        description:
          type: string
          nullable: true
          description: A short description to explain to the insured what they are purchasing.
        coverage_type:
          $ref: '#/components/schemas/CoverageType'
        effective_date:
          type: string
          format: date
          description: 'The date upon the billable goes into effect. Expected format: YYYY-MM-DD.'
        expiration_date:
          type: string
          format: date
          nullable: true
          description: 'The date when the billable is no longer active. Expected format: YYYY-MM-DD.'
        documents:
          type: array
          description: A collection of documents associated with the billable.
          items:
            type: object
            properties:
              title:
                type: string
                description: The display name of the static asset.
                nullable: true
              url:
                type: string
                description: The url to access the static asset.
        is_auditable:
          type: boolean
          description: Determines if the carrier can audit customer raising premium significantly.
        is_filed:
          type: boolean
          description: Determines if specific lines of business are filed with other bureaus which they have to notify on
            cancelation.
        is_short_rate:
          type: boolean
          description: 'Determines if the policy is fined by 10% on top of earned premium when insured cancels '
        min_days_to_cancel:
          type: integer
          description: Set state determined extended cancelation period for the policy.
        min_earned_rate:
          type: number
          format: float
          description: The minimum rate to charge insureds when they decide to finance.
        other_fees_cents:
          type: integer
          description: Any additional fees that come with the policy. This fee is treated as non-refundable & fully earned.
        parent_billable_id:
          type: string
          nullable: true
          format: uuid
          description: The unique identifier for the parent billable.
        policy_fee_cents:
          type: integer
          description: Any policy fees that come with the billable. This fee is treated as non-refundable & fully earned.
        policy_number:
          type: string
          nullable: true
          description: The number assigned to the policy once it has been bound.
        premium_cents:
          type: integer
          description: The amount to pay for the insurance policy.
        seller_commission_amount_cents:
          type: number
          format: integer
          description: Your commission amount for this policy.
        seller_commission_rate:
          type: number
          format: float
          nullable: true
          description: Your commission rate for this policy.
        commission_terms:
          type: array
          items:
            type: object
            properties:
              organization_account_id:
                type: string
                description: The organization account to receive the commission. If null the commission will be funded to
                  your organization.
              commission_cents:
                type: number
                description: The commission amount for this entity in cents.
        taxes_and_fees_cents:
          type: integer
          description: Any taxes & unearned fees. Taxes and fees are financed.
        program_id:
          type: string
          format: uuid
          description: The id of the program the billable should be a part of.
        surplus_lines_tax_cents:
          type: integer
          description: The amount of surplus lines tax to be collected.
        wholesaler:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Wholesaler'
        metadata:
          type: object
          description: Metadata associated with the billable.
          nullable: true
    CancelationReturn:
      type: object
      properties:
        billable:
          type: object
          properties:
            id:
              type: string
              description: The id of the billable to be canceled.
            cancelation_effective_date:
              type: string
              format: date
              description: The effective date of the cancelation
            is_flat_cancelation:
              type: boolean
              description: Indicates if this is a flat cancelation
          description: Details of the billable being canceled
        unearned_commission_cents:
          type: integer
          description: Unearned commission amount in cents
        unearned_surplus_lines_tax_cents:
          type: integer
          description: Unearned surplus lines tax amount in cents.
        unearned_premium_cents:
          type: integer
          description: Unearned premium amount in cents (Agency)
        unearned_organization_account_commission_cents:
          type: integer
          description: Unearned premium amount in cents (MGA)
        cancelation_docs:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: List of supporting documents attached to the cancelation return.
        organization_payments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The id of the organization payment.
          description: List of invoices to be paid by you.
    Carrier:
      type: object
      description: An insurance company.
      properties:
        identifier:
          type: string
          description: A human readable unique identifier.
        title:
          type: string
          description: The carrier display name.
        mailing_address_street_one:
          type: string
          description: Mailing Street address
          nullable: true
        mailing_address_street_two:
          type: string
          description: Suite or unit
          nullable: true
        mailing_address_city:
          type: string
          description: Mailing city
          nullable: true
        mailing_address_state:
          $ref: '#/components/schemas/StateAnsiCodes'
          nullable: true
        mailing_address_zip_code:
          type: string
          description: Mailing zip code
          nullable: true
    CoverageType:
      type: object
      description: A type of coverage.
      properties:
        identifier:
          type: string
          description: A human readable unique identifier.
        title:
          type: string
          description: The coverage type display name.
    FinanceEstimate:
      type: object
      description: Return estimated loan terms
      properties:
        downpayment_cents:
          type: integer
          description: The initial up-front payment represented in cents.
          minimum: 0
          example: 3955000
          readOnly: true
        term_payment_cents:
          type: integer
          description: The amount that will be payed in each payment.
          minimum: 0
          example: 2027691
          readOnly: true
        number_of_payments:
          type: integer
          description: The number of payments that will be made to repay the loan.
          minimum: 0
          example: 10
          readOnly: true
        payment_frequency:
          type: string
          enum:
          - monthly
          - quarterly
          - semiannual
          description: How often payments will be made.
          readOnly: true
        total_sale_price_cents:
          type: number
          format: double
          description: The total cost including downpayment and amount financed.
          example: 5012285
          readOnly: true
        apr:
          type: number
          format: double
          description: The annual rate charged.
          example: 0.055
          readOnly: true
        total_interest_cents:
          type: number
          format: double
          description: The total interest paid over the life of the loan.
          example: 0.055
          readOnly: true
      required:
      - downpayment_cents
      - term_payment_cents
      - number_of_payments
      - payment_frequency
      - total_sale_price_cents
      - apr
      - total_interest_cents
    Installment:
      type: object
      description: ''
      properties:
        id:
          type: string
          format: uuid
          description: Id of the installment
        status:
          type: string
          enum:
          - awaiting_payment
          - processing_payment
          - paid
          - overdue
          - void
          description: Status of the installment
        checkout_url:
          type: string
          format: uri
          description: Checkout url for the installment
        due_date:
          type: string
          format: date
          description: 'Due date of the installment. Format: YYYY-MM-DD'
        amount_cents:
          type: integer
          description: Total amount to be paid for the installment
        payables:
          type: array
          description: Payables paid to your organization
          items:
            type: object
            properties:
              amount_cents:
                type: integer
                description: Amount to be paid
              account_type:
                type: string
                enum:
                - trust_account
                - commission_account
                description: The type of the bank account that will receive funds
              remittance_memo:
                type: string
                description: Remittance memo such as the policy number to identify the payable
                maxLength: 50
        company_payables:
          type: array
          description: Payables paid to the issuing or billing company
          items:
            type: object
            properties:
              amount_cents:
                type: integer
                description: Amount to be paid
              identifier:
                type: string
                description: Identifier of the issuing or billing company
              remittance_memo:
                type: string
                description: Remittance memo such as the policy number to identify the payable
                maxLength: 50
        organization_account_payables:
          type: array
          description: Payables to partner agencies
          items:
            type: object
            properties:
              amount_cents:

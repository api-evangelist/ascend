          format: uuid
          description: The unique identifier of the payment method.
          readOnly: true
        payment_type:
          type: string
          enum:
          - card
          - ach_debit
          - ach_credit_transfer
          - us_bank_account
          - check
          description: The type of payment method.
          readOnly: true
        card:
          type: object
          description: Detailed information about the card.
          properties:
            last_four_digits:
              type: string
              description: The last four digits of the card.
            brand:
              type: string
              description: The card brand.
          required:
          - brand
          - last_four_digits
        ach_debit:
          type: object
          description: Detailed information about the ach method.
          properties:
            last_four_digits:
              type: string
              description: The last four digits of the account number.
            bank_name:
              type: string
              description: The name of the bank institution.
          required:
          - bank_name
          - last_four_digits
        ach_credit:
          type: object
          description: Detailed information about the ach credit method.
          properties:
            bank_name:
              type: string
              description: The name of the bank institution.
          required:
          - bank_name
    Payout:
      type: object
      description: Money transfers between accounts triggered after an insured pays a quote.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the payout.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: The date the payout was created. The date uses UTC and is represented in the iso8601 format.
          readOnly: true
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: The date the payout failed. The date uses UTC and is represented in the iso8601 format.
          readOnly: true
        gross_payout_amount_cents:
          type: integer
          description: The gross amount of the payout before fees. The value is represented in cents.
          readOnly: true
        gross_payout_amount_currency:
          type: string
          description: The three letter ISO-4217 currency code of the gross payout amount.
          readOnly: true
        installment_id:
          type: string
          format: uuid
          description: The unique identifier of the installment associated with this payout
          readOnly: true
        installment_plan_id:
          type: string
          format: uuid
          description: The unique identifier of the installment plan associated with this payout
          readOnly: true
        invoice_id:
          type: string
          format: uuid
          description: The unique identifier of the invoice associated with this payout
          readOnly: true
        net_payout_amount_cents:
          type: integer
          description: The net amount of the payout after fees. If there are no fees, this can be the same as gross payout
            amount. The value is represented in cents.
          readOnly: true
        net_payout_amount_currency:
          type: string
          description: The three letter ISO-4217 currency code of the net payout amount.
          readOnly: true
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: The time at which the payout was successfully transferred to the destination account. The date uses
            UTC and is represented in the iso8601 format.
          readOnly: true
        payable_account:
          type: object
          description: The destination account of the payout.
          properties:
            id:
              type: string
              format: uuid
              description: The unique identifier for the payout.
              readOnly: true
            bank_name:
              type: string
              nullable: true
              description: The name of the bank asssociated with the account.
              readOnly: true
            last_four_digits:
              type: integer
              nullable: true
              description: The last four digits of the bank account number
              readOnly: true
            routing_number:
              type: integer
              nullable: true
              description: The routing transit number for the bank account.
              readOnly: true
            owner_name:
              type: string
              nullable: true
              description: The name of the person or business that owns the account.
              readOnly: true
            usage_type:
              type: string
              enum:
              - trust_account
              - commission_account
              - supplier_account
              description: The purpose for which this account is used.
              readOnly: true
        paying_at:
          type: string
          format: date-time
          nullable: true
          description: The time at which the payout was initiated. The date uses UTC and is represented in the iso8601 format.
          readOnly: true
        payout_type:
          type: string
          enum:
          - full_premium
          - commission
          - take_rate
          - supplier
          description: The type of payout
          readOnly: true
        program_id:
          type: string
          format: uuid
          description: The unique identifier of the program associated with this payout
          readOnly: true
        quote_id:
          type: string
          format: uuid
          nullable: true
          description: The unique identifier of the quote associated with this payout
          readOnly: true
        recipient:
          type: object
          description: The entity receiving the payout funds.
          properties:
            type:
              type: string
              enum:
              - account
              - carrier
              - organization
              - wholesaler
              description: The type of entity that received the funds
              readOnly: true
        reference:
          type: string
          description: The reference number of the batch payout associated with this payout
          readOnly: true
        status:
          type: string
          enum:
          - unpaid
          - transferred
          - paying
          - paid
          - failed
          - skipped
          - refunded
          - pending_servicer_payment
          description: The state of the payout
          readOnly: true
        subscription_id:
          type: string
          format: uuid
          description: The unique identifier of the installment plan associated with this payout
          readOnly: true
          deprecated: true
        updated_at:
          type: string
          format: date-time
          description: The date the payout was last updated. The date uses UTC and is represented in the iso8601 format.
          readOnly: true

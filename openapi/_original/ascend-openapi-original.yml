  /v1/programs/{id}:
    parameters:
    - name: id
      in: path
      description: The program identifier
      required: true
      schema:
        type: string
    delete:
      summary: Archive Program
      tags:
      - Programs
      operationId: deleteProgram
      security:
      - bearer_auth: []
      responses:
        '204':
          description: Program archived
        '400':
          description: Bad request
        '404':
          description: Program not found
        '422':
          description: Can't archive program, rolling back
    get:
      summary: Get Program
      tags:
      - Programs
      operationId: getProgram
      security:
      - bearer_auth: []
      parameters:
      - name: include_archived
        required: false
        in: query
        description: Include archived programs
        schema:
          type: boolean
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          description: Program not found
    patch:
      summary: Update program
      tags:
      - Programs
      operationId: updateProgram
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '403':
          description: Forbidden
        '404':
          description: Program not found
      requestBody:
        content:
          application/json:
            schema:
              properties:
                account_manager_id:
                  description: The unique identifier of the user belonging to your organization that will be associated as
                    the account manager for the program. This user is listed as the agent on checkout and receives any program
                    communications. This defaults to the producer if not specified.
                  format: uuid
                  type: string
                secondary_account_manager_id:
                  description: The unique identifier of the user belonging to your organization that will be associated as
                    the secondary account manager for the program. This user receives any program communications that the
                    account manager also receives
                  format: uuid
                  type: string
                allowed_payment_methods:
                  type: array
                  description: A list of payment methods that are allowed during checkout.
                  items:
                    type: string
                    enum:
                    - card
                    - ach_debit
                    - ach_credit_transfer
                    - check
                due_date:
                  type: string
                  format: date
                  description: Due date of the program payment or downpayment. This cannot be changed after the program has
                    become active.
                endorsement_due_date:
                  type: string
                  format: date
                  description: Due date of the upcoming endorsement payment. This cannot be changed if there are no unpaid
                    endorsements on the program.
                failure_callback_url:
                  description: A URL to send the user back to after failed transaction occurs during the checkout process.
                    This defaults to the organization return url if not specified.
                  type: string
                hidden_payment_options:
                  type: array
                  description: A list of payment options that are hidden during checkout.
                  items:
                    type: string
                    enum:
                    - annual_pay_in_full
                is_checkout_overview_page_visible:
                  description: A configuration to let the customer view the overview page during the checkout process. This
                    defaults to false if not specified.
                  type: boolean
                is_checkout_receipt_page_visible:
                  description: A configuration to let the customer view the receipt page during the checkout process. This
                    defaults to false if not specified.
                  type: boolean
                organization_account:
                  type: object
                  description: (MGA only) The billing account associated to the program. This can represent either the wholesaler
                    or the retail agency.
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The unique identifier of the billing account associated to the program
                    users:
                      type: array
                      description: An array of user ids belonging to the billing account who should be associated to the program.
                      items:
                        type: string
                        format: uuid
                producer_id:
                  description: The unique identifier of the user associated as the producer of the program. This user is listed
                    on the premium finance agreement. This defaults to the insured assignee user if not specified.
                  format: uuid
                  type: string
                return_url:
                  description: A URL to send the user back to after dismissing the checkout process. This defaults to the
                    organization return url if not specified.
                  type: string
                success_callback_url:
                  description: A URL to send the user back to after successful transaction occurs during the checkout process.
                    This defaults to the organization return url if not specified.
                  type: string
                metadata:
                  type: object
                  description: Metadata to be associated with the program. Keys cannot be longer than 40 characters, cannot
                    contain [] or {}, and the entire metadata object must be less than 5kB.
                  nullable: true
              type: object

  /v1/organization_accounts/{account_id}/users:
    post:
      summary: Create account user
      tags:
      - Organization Account Users
      operationId: createOrgAccountUser
      security:
      - bearer_auth: []
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithArchivedStatus'
        '400':
          description: Bad request — user is archived, or email domain does not match an existing admin's domain
          content:
            application/json:
              examples:
                archived_user:
                  value:
                    errors:
                    - status: 400
                      title: Bad Request
                      detail: User is archived
                      source: {}
                email_domain_mismatch:
                  value:
                    errors:
                    - status: 400
                      title: Bad Request
                      detail: Cannot add a user with email domain 'test.com' since it does not match an existing admin's email
                        domain in this account
                      source: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The email of the user
                first_name:
                  type: string
                  description: First name of the user.
                last_name:
                  type: string
                  description: Last name of the user.
                phone:
                  type: string
                  description: 'Phone number of the user. Formatted: 5555555555'
                role:
                  type: string
                  description: User role
                  enum:
                  - producer
              required:
              - email
              - first_name
              - role

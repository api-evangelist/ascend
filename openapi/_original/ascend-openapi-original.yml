          description: Bad Request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                premium_cents:
                  type: integer
                  description: The gross premium reduction for the policy.
                minimum_earned_rate:
                  type: number
                  format: float
                  description: The minimum rate to charge insureds when they decide to finance.
                  minimum: 0
                  maximum: 1
                agency_fees_cents:
                  type: integer
                  minimum: 0
                  description: Fee collected by your agency. Fully earned, not financeable, and funded directly to your agency.
                policy_fee_cents:
                  type: integer
                  minimum: 0
                  description: Any policy fees that come with the quote. This fee is treated as non-refundable & fully earned.
                broker_fee_cents:
                  type: integer
                  minimum: 0
                  description: Fee collected by the wholesaler. Fully earned, not financeable, and funded directly to the
                    wholesaler.
                taxes_and_fees_cents:
                  type: integer
                  minimum: 0
                  description: Any taxes & unearned fees. Taxes and fees are financed.
                other_fees_cents:
                  type: integer
                  minimum: 0
                  description: Any additional fees that come with the policy. This fee is treated as non-refundable & fully
                    earned.
                custom_terms:
                  type: object
                  properties:
                    downpayment_rate:
                      type: number
                      format: float
                      description: The downpayment rate to be paid upfront.
                      minimum: 0
                      maximum: 1
                    interest_rate:
                      type: number
                      format: float
                      description: The interest rate for the quote.
                      minimum: 0
                      maximum: 1
                    number_of_payments:
                      type: integer
                      description: The number of payments that will be made to repay the loan.
                      minimum: 0
                      maximum: 10
                      example: 10
                    payment_frequency:
                      type: string
                      enum:
                      - monthly
                      - quarterly
                      - semiannual
                      description: How often payments will be made.
              required:
              - premium_cents
  /v1/installment_plans:
    post:
      summary: Create installment plan
      tags:
      - InstallmentPlans
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentPlan'
        '400':
          description: Bad request
        '422':
          description: Unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: An installment plan for a series of payments
              properties:
                account_manager_id:
                  type: string
                  format: uuid
                  description: Id of the account manager belonging to your organization who will receive email communications
                    for the installment plan
                secondary_account_manager_id:
                  type: string
                  format: uuid
                  description: Id of the secondary account manager belonging to your organization who will receive the same
                    email communications for the installment plan as the account manager
                attachments:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The unique identifier of the attachment.
                    required:
                    - id
                billing_type:
                  type: string
                  enum:
                  - agency_bill
                  - direct_bill
                  description: (MGA only) The type of billing used for this one time payment. If not specified, defaults to
                    the billing type on the organization account.
                installments:
                  type: array
                  description: An array of installments
                  items:
                    type: object
                    properties:
                      amount_cents:
                        type: integer
                        description: Total amount to be paid for the installment
                      due_date:
                        type: string
                        format: date
                        description: 'Due date of the installment. Format: YYYY-MM-DD'
                      payables:
                        type: array
                        description: Payables paid to your organization
                        items:
                          type: object
                          properties:
                            amount_cents:
                              type: integer
                              description: Amount to be paid
                            account_type:
                              type: string
                              enum:
                              - trust_account
                              - commission_account
                              description: The type of the bank account that will receive funds
                            remittance_memo:
                              type: string
                              description: Remittance memo such as the policy number to identify the payable
                              maxLength: 50
                          required:
                          - amount_cents
                          - account_type
                          - remittance_memo
                      company_payables:
                        type: array
                        description: Payables paid to the issuing or billing company
                        items:
                          type: object
                          properties:
                            amount_cents:
                              type: integer
                              description: Amount to be paid
                            identifier:
                              type: string
                              description: Identifier of the issuing or billing company
                            remittance_memo:
                              type: string
                              description: Remittance memo such as the policy number to identify the payable
                              maxLength: 50
                          required:
                          - amount_cents
                          - identifier
                          - remittance_memo
                      organization_account_payables:
                        type: array
                        description: Payables to partner agencies
                        items:
                          type: object
                          properties:
                            amount_cents:
                              type: integer
                              description: Amount to be paid
                            organization_account_id:
                              type: string
                              description: Organization account id for the partner agency
                            remittance_memo:
                              type: string
                              description: Remittance memo such as the policy number to identify the payable
                              maxLength: 50
                          required:
                          - amount_cents
                          - organization_account_id
                          - remittance_memo
                    required:
                    - amount_cents
                    - due_date
                  minItems: 2
                insured_id:
                  type: string
                  format: uuid
                  description: Id of the insured responsible for installment payments
                memo:
                  type: string
                  description: Short description for the installment plan
                  maxLength: 50
                metadata:
                  type: object
                  description: Metadata to be associated with the installment plan. Keys cannot be longer than 40 characters,
                    cannot contain [] or {}, and the entire metadata object must be less than 5kB.
                  nullable: true
                organization_account:
                  type: object
                  description: (MGA only) The billing account associated to the one time payment. This can represent either
                    the wholesaler or the retail agency.
                  nullable: true
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The unique identifier of the billing account associated to the one time payment.
                    users:
                      type: array
                      description: An array of user ids belonging to the billing account who should receive communications
                        for the installment plan.
                      items:
                        type: string
                        format: uuid
              required:
              - insured_id
              - account_manager_id
              - memo
              - installments

      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organization account identifier
      - name: email
        in: query
        required: false
        schema:
          type: string
        description: Filter by user email address (case-insensitive)
      - name: updated_at
        in: query
        style: deepObject
        explode: true

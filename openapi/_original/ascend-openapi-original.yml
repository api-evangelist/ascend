  /v1/one_time_payments:
    post:
      summary: Create One Time Payment
      tags:
      - OneTimePayments
      operationId: createOneTimePayment
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimePayment'
        '400':
          description: Bad Request
        '422':
          description: Unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: A document representing a transaction between an insured and an agency or MGA.
              properties:
                account_manager_id:
                  description: The unique identifier of the user belonging to your organization that will be associated as
                    the account manager for the one time payment. This user is listed as the agent on checkout and receives
                    any invoice communications
                  format: uuid
                  type: string
                secondary_account_manager_id:
                  description: The unique identifier of the user belonging to your organization that will be associated as
                    the secondary account manager for the one time payment. This user receives any invoice communications
                    that the account manager also receives
                  format: uuid
                  type: string
                attachments:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The unique identifier of the attachment.
                    required:
                    - id
                billing_type:
                  type: string
                  enum:
                  - agency_bill
                  - direct_bill
                  description: (MGA only) The type of billing used for this one time payment. If not specified, defaults to
                    the billing type on the organization account.
                due_date:
                  type: string
                  format: date
                  nullable: true
                  description: The date by which the one time payment should be paid.
                funds_distribution:
                  type: object
                  description: Dictates where funds will be routed upon receiving payment for this one time payment. Defaults
                    to full allocation to the issuer's configured bank account.
                  properties:
                    company_payables:
                      type: array
                      description: Payables paid to the issuing or billing company
                      items:
                        type: object
                        properties:
                          amount_cents:
                            type: integer
                            description: Amount to be paid
                          identifier:
                            type: string
                            description: Identifier of the issuing or billing company
                          remittance_memo:
                            type: string
                            description: Remittance memo such as the policy number to identify the payable
                            maxLength: 50
                        required:
                        - amount_cents
                        - identifier
                        - remittance_memo
                    organization_account_payables:
                      type: array
                      description: Payables to partner agencies
                      items:
                        type: object
                        properties:
                          amount_cents:
                            type: integer
                            description: Amount to be paid
                          organization_account_id:
                            type: string
                            description: Organization account id for the partner agency
                          remittance_memo:
                            type: string
                            description: Remittance memo such as the policy number to identify the payable
                            maxLength: 50
                        required:
                        - amount_cents
                        - organization_account_id
                        - remittance_memo
                    payables:
                      type: array
                      description: Payables paid to your organization
                      items:
                        type: object
                        properties:
                          account_type:
                            type: string
                            enum:
                            - trust_account
                            - commission_account
                            description: The type of the bank account that will receive funds
                          amount_cents:
                            type: integer
                            description: Amount to be paid
                          remittance_memo:
                            type: string
                            description: Remittance memo such as the policy number to identify the payable
                            maxLength: 50
                        required:
                        - account_type
                        - amount_cents
                        - remittance_memo
                insured_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the insured for this one time payment. By default, the one time payment
                    will be issued to the insured.
                invoice_items:
                  type: array
                  description: A breakdown of items being charged for.
                  items:
                    $ref: '#/components/schemas/InvoiceItem'
                memo:
                  type: string
                  description: Information about the one time payment shown to the payer.
                  default: Invoice for {payer_name}
                  nullable: true
                  example: Additional premium for auto policy
                metadata:
                  type: object
                  description: Metadata to be associated with the one time payment. Keys cannot be longer than 40 characters,
                    cannot contain [] or {}, and the entire metadata object must be less than 5kB.
                  nullable: true
                organization_account:
                  type: object
                  description: (MGA only) The billing account associated to the one time payment. This can represent either
